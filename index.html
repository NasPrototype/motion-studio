<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Studio</title>
  <meta name="description" content="Multi-domain simulation with a live 3D view, a wiring editor, photo-to-twin and hardware links.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="11" cy="11" r="3" fill="currentColor"/><path d="M11 1.5v4M11 16.5v4M1.5 11h4M16.5 11h4" stroke="currentColor" stroke-width="1.6"/></svg>
        <span class="wordmark">Motion Studio</span>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <label class="select-wrap">
        <span class="sr-only">Scene</span>
        <select id="scene-select" class="select select-quiet"></select>
      </label>

      <div class="transport" role="group" aria-label="Mode">
        <button id="mode-simulate" class="seg" aria-pressed="true">Simulate</button>
        <button id="mode-edit" class="seg" aria-pressed="false">Edit</button>
      </div>

      <div class="transport" role="group" aria-label="Simulation controls">
        <button id="btn-run" class="btn-run" aria-pressed="false" title="Run or pause (Space)">
          <svg class="i-play" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.8v8.4L10 6z" fill="currentColor"/></svg>
          <svg class="i-pause" width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M4.5 2.5v9M9.5 2.5v9" stroke="currentColor" stroke-width="2.4"/></svg>
          <span id="run-label">Run</span>
        </button>
        <button id="btn-step" class="icon-btn" aria-label="Step 10 ms" title="Step 10 ms (.)">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 2.5v9l6-4.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M11 2.5v9" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button id="btn-reset" class="icon-btn" aria-label="Reset to t = 0" title="Reset to t = 0 (R)">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.2 5.2A4.6 4.6 0 1 1 2.6 8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.4 2.2v3.4h3.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>

      <div class="readouts">
        <span><span class="muted">t</span> <span id="ro-time">0.000 s</span></span>
        <span id="ro-rate">paused</span>
        <label class="select-wrap"><span class="sr-only">Integrator</span>
          <select id="sel-method" class="select select-mono">
            <option value="be">implicit Euler</option>
            <option value="trap">trapezoidal</option>
          </select>
        </label>
        <label class="select-wrap"><span class="sr-only">Time step</span>
          <select id="sel-dt" class="select select-mono">
            <option value="0.0001">Δt 0.1 ms</option>
            <option value="0.00025">Δt 0.25 ms</option>
            <option value="0.0005" selected>Δt 0.5 ms</option>
            <option value="0.001">Δt 1 ms</option>
            <option value="0.002">Δt 2 ms</option>
          </select>
        </label>
      </div>

      <div class="spacer"></div>

      <div id="energy-pill" class="energy-pill" data-state="ok" role="status" aria-live="polite">
        <svg class="e-ok" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.2 7.2l2 2 3.6-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        <svg class="e-warn" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5L13 12.5H1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7 5.5v3.3M7 10.4v.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="e-crit" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M4.4 1.5h5.2l3.9 3.9v5.2l-3.9 3.9H4.4L.5 10.6V5.4z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 5l4 4M9 5l-4 4" stroke="currentColor" stroke-width="1.5"/></svg>
        <span class="e-label" title="Energy residual: supplied minus stored minus dissipated">Energy</span>
        <span id="energy-value" class="mono">0 %</span>
      </div>
      <button id="btn-lab" class="btn-outline" title="Lab and reference library: blueprints, test procedures, experiments and virtual test benches">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 1.5h4M5.8 1.5v4L2.2 11.6A1 1 0 0 0 3 13h8a1 1 0 0 0 .8-1.4L8.2 5.5v-4M3.8 9h6.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span>Lab</span>
      </button>
      <button id="btn-integrations" class="btn-outline integ-btn" title="Hardware and Unreal Engine" data-armed="false">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 1.5v3M9 1.5v3M3.5 4.5h7v2.5a3.5 3.5 0 0 1-7 0zM7 10.5v2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span id="integ-label">Connect</span>
        <span class="integ-dots" aria-hidden="true"><span id="dot-hw" class="dot-state" data-state="off"></span><span id="dot-eng" class="dot-state" data-state="off"></span></span>
      </button>
      <button id="btn-theme" class="icon-btn icon-btn-outline" aria-label="Switch to light theme">
        <svg class="i-sun" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v1.8M8 13.2V15M1 8h1.8M13.2 8H15M3 3l1.3 1.3M11.7 11.7L13 13M13 3l-1.3 1.3M4.3 11.7L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="i-moon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A6 6 0 0 1 6.4 2.5a6 6 0 1 0 7.1 7.1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="workspace">
      <aside class="rail" aria-label="Model">
        <div class="tabs" role="tablist" aria-label="Rail">
          <button class="tab" role="tab" id="tab-model" aria-selected="true" aria-controls="panel-model">Model</button>
          <button class="tab" role="tab" id="tab-library" aria-selected="false" aria-controls="panel-library">Library</button>
          <button class="tab" role="tab" id="tab-scenes" aria-selected="false" aria-controls="panel-scenes">Scenes</button>
        </div>
        <div id="panel-model" role="tabpanel" aria-labelledby="tab-model" class="rail-panel">
          <div class="filter">
            <label class="field field-search">
              <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9.2 9.2L12.5 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <input id="filter" type="search" placeholder="Filter components" aria-label="Filter components" autocomplete="off">
            </label>
          </div>
          <div id="problems" class="problems" hidden></div>
          <nav id="tree" class="tree" aria-label="Components"></nav>
        </div>
        <div id="panel-library" role="tabpanel" aria-labelledby="tab-library" class="rail-panel" hidden>
          <div class="rail-actions">
            <button id="btn-new-lib" class="btn-outline btn-small">New circuit</button>
            <button id="btn-photo-lib" class="btn-outline btn-small">Photo to twin</button>
          </div>
          <p class="rail-hint">Click a part to add it, or drag it into the view. Then click a port and another port to wire them.</p>
          <div id="library" class="tree"></div>
        </div>
        <div id="panel-scenes" role="tabpanel" aria-labelledby="tab-scenes" class="rail-panel" hidden>
          <div class="rail-actions">
            <button id="btn-new" class="btn-outline btn-small">New circuit</button>
            <button id="btn-photo" class="btn-outline btn-small">Photo to twin</button>
            <button id="btn-import" class="btn-outline btn-small">Import</button>
            <button id="btn-export" class="btn-outline btn-small">Export</button>
            <input id="import-file" type="file" accept=".json,application/json" hidden>
          </div>
          <ul id="scene-list" class="scene-list"></ul>
        </div>
        <div id="scene-note" class="scene-note"></div>
      </aside>

      <main class="stage">
        <div id="viewport" class="viewport">
          <div class="overlay overlay-tl" role="group" aria-label="Camera view">
            <button class="seg" data-view="perspective" aria-pressed="true">Perspective</button>
            <button class="seg" data-view="top" aria-pressed="false">Top</button>
            <button class="seg" data-view="front" aria-pressed="false">Front</button>
            <button class="seg seg-icon" data-view="frame" aria-label="Frame selection" title="Frame selection (F)">
              <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 4.5v-3h3M9.5 1.5h3v3M12.5 9.5v3h-3M4.5 12.5h-3v-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
          </div>
          <div class="overlay overlay-tr" role="group" aria-label="Overlays">
            <button class="seg" data-toggle="labels" aria-pressed="true">Labels</button>
            <button class="seg" data-toggle="flow" aria-pressed="true">Flow</button>
            <button class="seg" data-toggle="heat" aria-pressed="true">Heat</button>
          </div>
          <div id="legend" class="overlay overlay-bl legend"></div>
          <div id="hint" class="overlay overlay-br hint">Drag to orbit · right-drag to pan · scroll to zoom</div>
          <div id="callouts" class="callouts" aria-hidden="true"></div>
          <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
          <div id="banner" class="banner" role="alert" hidden></div>
        </div>

        <div class="dock">
          <section class="scopes" aria-label="Scopes">
            <div class="dock-head">
              <div class="tabs tabs-small" role="tablist" aria-label="Dock">
                <button class="tab" role="tab" id="dock-scopes" aria-selected="true" aria-controls="dock-panel-scopes">Scopes</button>
                <button class="tab" role="tab" id="dock-hw" aria-selected="false" aria-controls="dock-panel-hw">Hardware log</button>
              </div>
              <button id="btn-scene-traces" class="btn-outline btn-small" hidden>Back to scene traces</button>
              <span id="scope-window" class="muted mono small">window 10 s</span>
            </div>
            <div id="dock-panel-scopes" role="tabpanel" aria-labelledby="dock-scopes" class="scope-wrap">
              <canvas id="scope-canvas" aria-label="Strip charts of the scene's signals"></canvas>
            </div>
            <div id="dock-panel-hw" role="tabpanel" aria-labelledby="dock-hw" class="hw-panel" hidden>
              <div class="hw-row"><span id="hw-status" class="hw-status">No device connected.</span><button id="hw-open" class="btn-outline btn-small">Hardware settings</button></div>
              <pre id="hw-log" class="hw-log"></pre>
            </div>
          </section>
          <section id="ledger" class="ledger" aria-label="Energy ledger"></section>
        </div>
      </main>

      <aside id="inspector" class="inspector" aria-label="Inspector"></aside>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
